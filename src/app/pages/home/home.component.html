<div class="home-container">
  <section class="carousel-section">
    <img
      [src]="slides[currentSlide].image"
      [alt]="slides[currentSlide].title"
      class="carousel-image"
    />

    <div class="carousel-overlay">
      <h1>{{ slides[currentSlide].title }}</h1>
      <p>{{ slides[currentSlide].description }}</p>
    </div>

    <button class="arrow left" type="button" (click)="previousSlide()">
      ❮
    </button>

    <button class="arrow right" type="button" (click)="nextSlide()">
      ❯
    </button>
  </section>

  <section class="login-section">
    <form class="login-card" (ngSubmit)="login()">
      <h2>Login</h2>
      <p>Enter your credentials to continue.</p>

      <label for="email">Email</label>
      <input
        id="email"
        name="email"
        type="email"
        [(ngModel)]="email"
        required
        placeholder="admin&#64;example.com"
      />

      <label for="password">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        [(ngModel)]="password"
        required
        placeholder="Enter password"
      />

      <!-- Updated old *ngIf to the modern Angular @if control flow -->
      @if (errorMessage) {
        <p class="error">{{ errorMessage }}</p>
      }

      <button type="submit">Sign in</button>

      <small>Demo: admin&#64;example.com / admin123</small>
    </form>
  </section>
</div>
